# ioTube witness route: iotex-to-bsc
# Operator values come from the environment (<data-dir>/etc/.env, see
# .env.example in ioTube/witness-service). The witness reads WITNESS_PRIVATE_KEY
# (or WITNESS_KMS_KEY_ID), RELAYER_URL and the sign-policy settings from the
# environment as well; this file needs no edits.
chain: "iotex"
grpcPort: 9280
grpcProxyPort: 9281
interval: 1m
batchSize: 1000
database:
  uri: "root:${DB_ROOT_PASSWORD}@tcp(localhost:13306)/witness?parseTime=true"
  driver: "mysql"
clientURL: "${IOTEX_RPC_URL}"
cashiers:
  - id: "iotex-to-bsc-payload"
    withPayload: true
    relayerURL: ":7203"
    cashierContractAddress: "0xa016f866a606221E9C9E6ab3a942Bfc81F6074f4"
    tokenSafeContractAddress: "0xc4A29a94f12be03033daa4e6Ce9b9678c26275a2"
    validatorContractAddress: "0x95C6F6Af2c0Fa069768203FDa963d7626efC794a"
    startBlockHeight: ${IOTEX_TO_BSC_START_HEIGHT}
    transferTableName: "iotex_to_bsc_transfers"
    tokenPairs:
      # WBNB
      - token1: "io1jlnvfzr8lhper2xla8gknmxsqhgajq5ravu4wr"
        token2: "0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c"
