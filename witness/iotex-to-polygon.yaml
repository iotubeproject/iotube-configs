    validatorContractAddress: "0x87E2D48De6CC2029fFc1a915462e4Aa597890cd6"
    startBlockHeight: ${IOTEX_TO_POLYGON_START_HEIGHT}
    transferTableName: "iotex_to_matic_transfers"
