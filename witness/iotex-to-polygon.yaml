# ioTube witness route: iotex-to-polygon
# Operator values come from the environment (<data-dir>/etc/.env, see
# .env.example in ioTube/witness-service). The witness reads WITNESS_PRIVATE_KEY
# (or WITNESS_KMS_KEY_ID), RELAYER_URL and the sign-policy settings from the
# environment as well; this file needs no edits.
chain: "iotex"
grpcPort: 9288
grpcProxyPort: 9289
interval: 1m
batchSize: 1000
database:
  uri: "root:${DB_ROOT_PASSWORD}@tcp(localhost:13306)/witness?parseTime=true"
  driver: "mysql"
clientURL: "${IOTEX_RPC_URL}"
cashiers:
